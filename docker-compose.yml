services:
  postgres:
    image: postgres:16-alpine
    container_name: tributos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tributos
      POSTGRES_USER: tributos
      POSTGRES_PASSWORD: tributos
    ports:
      # 5433 no host — 5432 costuma estar ocupada por outro projeto local.
      - '5433:5432'
    volumes:
      - tributos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tributos']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tributos_postgres_data:
