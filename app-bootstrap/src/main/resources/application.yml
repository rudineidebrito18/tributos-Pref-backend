spring:
  application:
    name: tributos-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tributos}
    username: ${DB_USERNAME:tributos}
    password: ${DB_PASSWORD:tributos}

  jpa:
    # Schema é gerenciado 100% por Flyway — Hibernate nunca cria/altera tabela sozinho.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    # Scan padrão (classpath:db/migration) já cobre as subpastas de TODOS os módulos no
    # classpath (ex.: platform-identity traz db/migration/platform/*). Cada módulo novo
    # (module-iss, module-iptu...) só precisa criar sua própria subpasta — nenhuma
    # configuração adicional aqui. Ver PLANEJAMENTO_PROJETO.md §7.3.
    locations: classpath:db/migration

app:
  security:
    jwt:
      # Precisa ter >= 32 bytes (HS256). O valor abaixo é só para dev local — em qualquer
      # outro ambiente, defina APP_SECURITY_JWT_SECRET com um segredo gerado
      # aleatoriamente (ex.: `openssl rand -base64 48`) e nunca versionado.
      secret: ${APP_SECURITY_JWT_SECRET:desenvolvimento-local-nao-usar-em-producao-0123456789}
      emissor: ${APP_SECURITY_JWT_EMISSOR:tributos-backend}
    mfa:
      emissor: ${APP_SECURITY_MFA_EMISSOR:Tributos}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    br.com.tributos: INFO
