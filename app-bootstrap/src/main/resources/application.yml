spring:
  application:
    name: tributos-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tributos}
    username: ${DB_USERNAME:tributos}
    password: ${DB_PASSWORD:tributos}

  jpa:
    # Schema é gerenciado 100% por Flyway — Hibernate nunca cria/altera tabela sozinho.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    # Scan padrão (classpath:db/migration) já cobre as subpastas de TODOS os módulos no
    # classpath (ex.: platform-identity traz db/migration/platform/*). Cada módulo novo
    # (module-iss, module-iptu...) só precisa criar sua própria subpasta — nenhuma
    # configuração adicional aqui. Ver PLANEJAMENTO_PROJETO.md §7.3.
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 14MB

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  # Chave para cifrar segredos em repouso (credenciais PIX). Mínimo recomendado: 32 bytes.
  secret-key: ${APP_SECRET_KEY:desenvolvimento-local-chave-cifra-nao-usar-em-producao!!}
  security:
    jwt:
      # Precisa ter >= 32 bytes (HS256). O valor abaixo é só para dev local — em qualquer
      # outro ambiente, defina APP_SECURITY_JWT_SECRET com um segredo gerado
      # aleatoriamente (ex.: `openssl rand -base64 48`) e nunca versionado.
      secret: ${APP_SECURITY_JWT_SECRET:desenvolvimento-local-nao-usar-em-producao-0123456789}
      emissor: ${APP_SECURITY_JWT_EMISSOR:tributos-backend}
    mfa:
      emissor: ${APP_SECURITY_MFA_EMISSOR:Tributos}
  cadastro:
    documentos:
      diretorio-base: ${APP_CADASTRO_DOCUMENTOS_DIR:./data/documentos}
      tamanho-maximo-mb: ${APP_CADASTRO_DOCUMENTOS_MAX_MB:10}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # Só health/info/probes ficam expostos publicamente (ver SecurityConfig); os demais
        # endpoints do Actuator (env, beans, threaddump, ...) continuam OFF por padrão —
        # não são cobertos pela mesma allowlist de caminhos públicos.
        include: health,info
  endpoint:
    health:
      # Grupos /actuator/health/liveness e /actuator/health/readiness (padrão Kubernetes).
      probes:
        enabled: true
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: 0.1.0-SNAPSHOT

logging:
  level:
    br.com.tributos: INFO
  pattern:
    # %X{requestId} vem do RequestIdFilter — correlaciona todas as linhas de uma mesma
    # requisição, inclusive quando ela é rejeitada antes de chegar num controller.
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{requestId:-sem-id}] %-40.40logger{39} : %m%n%wEx"
  # Em produção, prefira logs estruturados em JSON (Elastic Common Schema ou Logstash) —
  # recurso nativo do Spring Boot desde a 3.4, sem dependência extra. O MDC (requestId) é
  # incluído automaticamente como campo. Ative via variável de ambiente, sem mudar código:
  #   LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs        (ou: logstash, gelf)
